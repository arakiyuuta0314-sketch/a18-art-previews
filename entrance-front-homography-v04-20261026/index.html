<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A18 正面額縁から右手前へ｜射影変形 v04</title>
<style>
*{box-sizing:border-box}body{background:#f7f5f0;color:#233027;margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.58}
main{max-width:850px;padding:15px 12px 46px;margin:auto}h1{font-size:21px;line-height:1.42;margin:7px 0}h2{font-size:17px}
small,p.note{color:#68746a}.viewer{background:#132018;border-radius:12px;padding:7px;margin:12px 0}
.viewer img{display:block;width:100%;max-width:546px;height:auto;margin:auto;aspect-ratio:546/483}
fieldset{border:1px solid #d1ddd3;border-radius:11px;background:#fff;padding:10px;margin:12px 0}
legend{font-weight:700;padding:0 5px}.buttons{display:flex;flex-wrap:wrap;gap:7px}
button{cursor:pointer;flex:1 1 92px;padding:11px 8px;font-size:14px;background:#fff;border:1px solid #b9c8bb;border-radius:9px;color:inherit}
button[aria-pressed=true]{background:#dcebdc;border-color:#3b815b;color:#1c5036;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}figure{margin:0}.grid img{width:100%;height:auto;border-radius:7px;display:block}figcaption{font-size:12px;color:#657066;text-align:center;margin-top:4px}
#status{font-size:14px;color:#4b5c50}.explain{font-size:13px;border-left:3px solid #9ab09b;padding-left:9px;color:#647168}
</style></head><body><main>
<small>A18「とっておき美術館」｜既存546×483原画・正式キャラはそのまま</small>
<h1>右手前の木製額縁：正面素材から遠近変形</h1>
<p>背面左の正面木製額縁を共通素材として、右手前の金額縁の位置と写真窓へ当て込んだ改善候補です。</p>
<div class="viewer"><img id="scene" src="view_new_empty_100.png" width="546" height="483" alt="正面木製素材を遠近変形で右手前に配置した実エントランス"></div>
<div id="status">新方式（正面素材から変形）／空き台紙／100%</div>
<fieldset><legend>右手前の額縁を比較</legend><div class="buttons">
<button data-mode="new" aria-pressed="true">新方式</button>
<button data-mode="v03" aria-pressed="false">前回 v03</button>
<button data-mode="old" aria-pressed="false">旧木製</button>
<button data-mode="gold" aria-pressed="false">金額縁</button>
<button data-mode="none" aria-pressed="false">額縁なし</button>
</div></fieldset>
<fieldset><legend>展示状態</legend><div class="buttons">
<button data-photo="empty" aria-pressed="true">空き台紙</button><button data-photo="photos" aria-pressed="false">写真あり</button>
</div></fieldset>
<fieldset><legend>サイズ</legend><div class="buttons">
<button data-scale="90" aria-pressed="false">90%</button><button data-scale="100" aria-pressed="true">100%</button><button data-scale="110" aria-pressed="false">110%</button>
</div></fieldset>
<h2>比較（右手前だけ変更）</h2>
<div class="grid"><figure><img src="view_v03_empty_100.png" loading="lazy" alt="前回の木枠"><figcaption>前回 v03</figcaption></figure>
<figure><img src="view_new_empty_100.png" loading="lazy" alt="今回の射影変形"><figcaption>今回 v04</figcaption></figure></div>
<p class="explain">正面額縁を上・右・下・左の四辺ごとに射影変形する共通処理です。写真窓と外周をそれぞれ同じ登録座標に合わせることで隙間を防ぎます。逆向きにも同じ処理を利用できます。金額縁の細かな装飾は木製に再現しません。ゲーム統合前、Lv.1採用未決定の美術確認候補です。</p>
</main><script>
(()=>{const v={mode:"new",photo:"empty",scale:100},im=document.getElementById("scene");
const labels={new:"新方式（正面素材から変形）",v03:"前回 v03",old:"旧木製",gold:"金額縁",none:"額縁なし"};
function draw(){im.src="view_"+v.mode+"_"+v.photo+"_"+v.scale+".png";
document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===v.mode)));
document.querySelectorAll("[data-photo]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.photo===v.photo)));
document.querySelectorAll("[data-scale]").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.scale)===v.scale)));
document.getElementById("status").textContent=labels[v.mode]+"／"+(v.photo==="empty"?"空き台紙":"写真あり")+"／"+v.scale+"%";}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{v.mode=b.dataset.mode;draw()}));
document.querySelectorAll("[data-photo]").forEach(b=>b.addEventListener("click",()=>{v.photo=b.dataset.photo;draw()}));
document.querySelectorAll("[data-scale]").forEach(b=>b.addEventListener("click",()=>{v.scale=Number(b.dataset.scale);draw()}));
window.A18Projective={state:()=>({...v}),get ready(){return im.complete&&im.naturalWidth===546}};
})();
</script></body></html>
