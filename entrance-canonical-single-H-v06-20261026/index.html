<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A18 エントランス右手前｜1つの射影変換で額縁・台紙・写真を統一 v06</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#26312a;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.6}
main{max-width:880px;margin:auto;padding:14px 12px 48px}small,.muted{color:#607164}h1{font-size:21px;line-height:1.42;margin:4px 0 12px}
h2{font-size:17px;margin:24px 0 10px}p{margin:8px 0 14px}
.stage{border-radius:12px;background:#152117;padding:8px;margin:10px 0}
.stage img{display:block;width:100%;max-width:546px;height:auto;aspect-ratio:546/483;margin:auto}
fieldset{background:#fff;border:1px solid #d2ded5;border-radius:11px;margin:12px 0;padding:10px 12px}
legend{padding:0 7px;font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:7px}.controls button{flex:1 1 92px;font:inherit;font-size:14px;border:1px solid #b8c7b9;border-radius:8px;padding:11px 8px;background:white;color:#26332b;cursor:pointer}
.controls button[aria-pressed=true]{border-color:#397c58;background:#dfece1;color:#1d5137;font-weight:bold}
#status{font-size:14px;color:#47604e;margin:7px 0 14px}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
figure{margin:0}.compare img{display:block;width:100%;height:auto;border-radius:7px}figcaption{text-align:center;margin:6px 0;font-size:12px;color:#647269}
.note{font-size:13px;color:#617168;border-left:3px solid #9bb29f;padding-left:10px}
@media(min-width:750px){main{padding:24px 18px}h1{font-size:25px}}
</style></head><body><main>
<small>A18「とっておき美術館」／正式原画 546×483／美術確認用 v06</small>
<h1>右手前の額縁と台紙を、同じ角度に統一しました</h1>
<p>正面の共通額縁を、1つの射影変換で右手前に配置しています。木製・金額縁だけでなく、台紙・写真・写真窓も同じ変換です。</p>
<div class="stage"><img id="scene" src="view_wood_empty_100.png" width="546" height="483" alt="新方式の木製額縁・台紙・写真窓が揃ったA18エントランス"></div>
<div id="status">木製／空き台紙／100%</div>
<fieldset><legend>右手前の額縁を比較</legend><div class="controls">
<button data-style="wood" aria-pressed="true">木製</button>
<button data-style="gold" aria-pressed="false">金額縁</button>
<button data-style="gold_body" aria-pressed="false">金色の基本枠</button>
<button data-style="none" aria-pressed="false">額縁なし</button>
</div></fieldset>
<fieldset><legend>写真窓を比較</legend><div class="controls">
<button data-mode="empty" aria-pressed="true">空き台紙</button>
<button data-mode="photos" aria-pressed="false">写真サンプル</button>
<button data-mode="registration" aria-pressed="false">四隅位置の確認</button>
</div></fieldset>
<fieldset><legend>サイズ</legend><div class="controls">
<button data-scale="90" aria-pressed="false">90%</button>
<button data-scale="100" aria-pressed="true">100%</button>
<button data-scale="110" aria-pressed="false">110%</button>
</div></fieldset>
<h2>前回v05と今回v06の比較</h2>
<div class="compare">
<figure><img src="QA_previous_v05_wood_empty.png" alt="前回v05の木製額縁と台紙" loading="lazy"><figcaption>前回 v05</figcaption></figure>
<figure><img src="view_wood_empty_100.png" alt="今回v06の統一射影変換" loading="lazy"><figcaption>今回 v06</figcaption></figure>
</div>
<p class="note">元の右手前の豪華な金額縁を画素単位で再現したものではありません。今回は正面素材由来の木・金・台紙・写真を一括で変形しています。登録写真の入力・変形関数は単体試験済みですが、ゲーム本体へはまだ統合していません。Lv.1に採用するかは未決定です。</p>
</main><script>
(()=>{const state={style:"wood",mode:"empty",scale:100},view=document.querySelector('#scene');
const names={wood:"木製",gold:"金額縁",gold_body:"金色の基本枠",none:"額縁なし"};
function render(){
 view.src='view_'+state.style+'_'+state.mode+'_'+state.scale+'.png';
 for(const key of ['style','mode','scale'])document.querySelectorAll('[data-'+key+']').forEach(b=>b.setAttribute('aria-pressed',String((key==='scale'?Number(b.dataset[key]):b.dataset[key])===state[key])));
 document.querySelector('#status').textContent=names[state.style]+'／'+({empty:'空き台紙',photos:'写真サンプル',registration:'四隅の位置確認'})[state.mode]+'／'+state.scale+'%';
}
for(const key of ['style','mode','scale'])document.querySelectorAll('[data-'+key+']').forEach(b=>b.addEventListener('click',()=>{state[key]=key==='scale'?Number(b.dataset[key]):b.dataset[key];render()}));
window.A18SingleH={state:()=>({...state}),get ready(){return view.complete&&view.naturalWidth===546}};
})();
</script></body></html>
