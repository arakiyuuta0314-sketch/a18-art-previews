<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,">
<title>A18 エントランス右手前の額縁復元 v08</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#131b17;color:#f0ecdf;font:14px/1.6 system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:auto;padding:20px 12px 38px}.series{font-size:12px;color:#c8ba9d}h1{font-size:19px;margin:6px 0 4px}h2{font-size:15px;margin:16px 0 8px}p{color:#cdd4ca;font-size:13px}
.controls{display:flex;gap:8px;margin:16px 0 12px}.controls button{flex:1;min-height:50px;border:1px solid #596c5a;border-radius:12px;background:#273329;color:#eeeede;font-weight:bold;cursor:pointer}
.controls button[aria-pressed=true]{background:#b88b58;color:#221a10;border-color:#d9ae74}
canvas{display:block;width:100%;height:auto;aspect-ratio:546/483;background:#151a17;border:1px solid #51604f;border-radius:11px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
figure{margin:0}figure img{width:100%;height:auto;display:block;border:1px solid #526051;border-radius:9px}figcaption{text-align:center;font-size:12px;color:#e0d4c1;margin:3px 0 7px}
details{border:1px solid #4d5c51;border-radius:10px;padding:12px;margin:20px 0}summary{color:#efd4a4;font-weight:700;cursor:pointer}
details figure{margin:12px 0 16px}
.status{font-size:12px;color:#c4d0c4;margin:10px 0}small{color:#b5c2b7}
</style></head><body><main>
<div class="series">とっておき美術館 A18｜美術監修用 v08</div>
<h1>右手前の木製額縁を復元</h1>
<p>修正後は49番の正式な木製額縁を四辺とも表示。右奥の柱を端まで伸ばしたv07建築はそのまま維持しています。</p>
<div class="controls" role="group" aria-label="木製額縁の切替">
<button id="btnOn" type="button" aria-pressed="true">額縁あり（修正後）</button>
<button id="btnOff" type="button" aria-pressed="false">無装飾（OFF）</button>
</div>
<canvas id="scene" width="546" height="483" aria-label="右手前の額縁あり"></canvas>
<div id="status" class="status" role="status">画像読み込み中</div>
<h2>左右に並べて比較</h2>
<div class="pair">
<figure><img width="546" height="483" src="entrance_OFF.png?v=20261026v08" alt="額縁なし、無装飾v07"><figcaption>額縁なし｜無装飾の下地</figcaption></figure>
<figure><img width="546" height="483" src="entrance_ON.png?v=20261026v08" alt="右手前の木製額縁を復元"><figcaption>額縁あり｜修正後v08</figcaption></figure>
</div>
<details id="zoom"><summary>右手前の額縁を拡大して確認</summary>
<p>左がOFF、右がONです。画像をタップすると拡大できます。</p>
<figure><figcaption>右手前の額縁全体</figcaption><a href="QA_right_front_comparison.png?v=20261026v08" target="_blank" rel="noopener"><img src="QA_right_front_comparison.png?v=20261026v08" loading="lazy" alt="右手前の額縁ありなし比較"></a></figure>
<figure><figcaption>上側・角の接合</figcaption><a href="QA_top_corner_comparison.png?v=20261026v08" target="_blank" rel="noopener"><img src="QA_top_corner_comparison.png?v=20261026v08" loading="lazy" alt="額縁上部の接合比較"></a></figure>
<figure><figcaption>下側の縁</figcaption><a href="QA_lower_edge_comparison.png?v=20261026v08" target="_blank" rel="noopener"><img src="QA_lower_edge_comparison.png?v=20261026v08" loading="lazy" alt="額縁下部の接合比較"></a></figure>
</details>
<small>額縁以外はON/OFFで同一。無装飾版は消さずに維持しています。Lv.1デザイン・最終美術採用は未決定です。</small>
</main><script>
(()=>{'use strict';const images={},paths={ON:'entrance_ON.png?v=20261026v08',OFF:'entrance_OFF.png?v=20261026v08'};let mode='ON';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false}),buttons={ON:document.getElementById('btnOn'),OFF:document.getElementById('btnOff')},status=document.getElementById('status');
function paint(){if(!images[mode])return;ctx.drawImage(images[mode],0,0,546,483);buttons.ON.setAttribute('aria-pressed',String(mode==='ON'));buttons.OFF.setAttribute('aria-pressed',String(mode==='OFF'));status.textContent=mode==='ON'?'表示中：右手前の木製額縁あり':'表示中：無装飾・木製額縁なし';canvas.setAttribute('aria-label',status.textContent)}
for(const m of ['ON','OFF'])buttons[m].onclick=()=>{mode=m;paint()};
(async()=>{for(const [k,url] of Object.entries(paths)){const img=new Image();img.src=url;await img.decode();if(img.naturalWidth!==546||img.naturalHeight!==483)throw Error('image dimensions '+k);images[k]=img}paint();window.A18RightFrameV08={ready:true,setMode:(m)=>{if(!paths[m])throw Error('Invalid mode');mode=m;paint()},getMode:()=>mode}})().catch(e=>{console.error(e);status.textContent='画像の読み込みに失敗しました'});
})();
</script></body></html>
