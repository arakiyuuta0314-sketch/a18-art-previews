<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>A18家具 v03｜監修</title><style>body{margin:0;background:#f3efe8;color:#29241c;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1100px;margin:auto;padding:15px}h1{font-size:23px}p{line-height:1.7;font-size:14px}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{flex:1;padding:12px 5px;border:1px solid #999;border-radius:9px;background:white;font-size:14px}.tabs button.on{background:#31574a;color:white}img{width:100%;height:auto;border-radius:9px;box-shadow:0 3px 16px #0002}.note{background:white;border-radius:10px;padding:12px;margin-top:15px}a{color:#285b4a}</style></head><body><main><h1>A18｜エントランス家具 v03</h1><p>Blender製の独立素材を承認済み背景に合成した未承認の比較候補です。ゲーム画面ではありません。</p><div class="tabs"><button class="on" id="a" onclick="swap(false)">家具配置</button><button id="b" onclick="swap(true)">写真位置ガイド</button></div><img id="pic" src="candidate-v03.png" width="1092" height="966" alt="v03候補"><div class="note"><p>左：右向き受付面のL字カウンター、手前左端へ短辺を延長。右：手前に移動した大型仕切り壁。水色枠は写真の独立表示位置の検討線で、壁に焼き込まれていません。</p><p><strong>まだ品質・配置とも未承認です。</strong>執事の立ち位置や素材の陰影も含めて修正対象です。</p><p><a href="./">以前のv02を見る</a></p></div></main><script>function swap(b){document.getElementById('pic').src=b?'photo-guide-v03.png':'candidate-v03.png';document.getElementById('a').classList.toggle('on',!b);document.getElementById('b').classList.toggle('on',b)}</script></body></html>
