<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>A18 エントランス家具 v02｜監修用</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e9;color:#27251f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
header{padding:24px 16px 14px;text-align:center}h1{font-size:clamp(20px,4.5vw,30px);margin:0 0 8px}p{line-height:1.7}header p{font-size:13px;color:#6b655a;margin:0}
main{max-width:1100px;margin:auto;padding:12px}.switch{display:flex;gap:8px;margin-bottom:12px}.switch button{flex:1;padding:13px 8px;border:1px solid #a99d8c;background:white;border-radius:10px;font-size:14px;color:#342d25}.switch button.active{background:#2f5447;color:white;border-color:#2f5447;font-weight:700}
figure{margin:0;background:#ddd;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px #0002}img{display:block;width:100%;height:auto}figcaption{padding:12px 16px;font-size:13px;line-height:1.7;background:white}
.note{background:white;border-radius:12px;padding:14px 18px;margin-top:15px;font-size:14px}.note strong{color:#31594c}footer{font-size:12px;color:#777;text-align:center;padding:24px}
</style></head><body><header><h1>とっておき美術館｜エントランス家具 v02</h1><p>2026-10-28 ・ 未承認のBlender制作候補 ・ iPhone監修用</p></header>
<main><nav class="switch"><button class="active" id="btnA" onclick="show(false)">配置イメージ</button><button id="btnB" onclick="show(true)">写真配置ガイド</button></nav>
<figure><img id="preview" src="candidate.png" width="1092" height="966" alt="正式背景に木製カウンター、執事、右側展示仕切り壁を合成した候補"><figcaption id="desc">実際の承認済み背景と正式キャラクターに、Blender制作の独立家具を合成した画像です。ゲーム画面のスクリーンショットではありません。</figcaption></figure>
<section class="note"><strong>今回確認したいこと</strong><p>左カウンターと執事の位置、右仕切り壁の大きさ・角度、中央通路の広さ。木目や装飾、写真の位置はまだ確定していません。</p><p>正式ゲームと背景画像は変更していません。写真・額縁・台紙は壁の素材に焼き込んでいません。</p></section></main>
<footer>一時監修ページ。完成素材・正式採用・ゲーム実装ではありません。</footer>
<script>function show(guide){document.getElementById('preview').src=guide?'photo-guide.png':'candidate.png';document.getElementById('desc').textContent=guide?'水色の線は展示写真をゲーム側で独立表示する場合の検討ガイドです。壁の素材には含まれません。':'正式背景と正式キャラクターを用いたBlender家具の合成プレビューです。ゲーム実装画面ではありません。';document.getElementById('btnA').classList.toggle('active',!guide);document.getElementById('btnB').classList.toggle('active',guide)}</script></body></html>
